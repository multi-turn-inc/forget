[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forget-ai"
version = "0.3.3"
description = "Memory for your AI. It forgets the junk, keeps what matters."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "multi-turn" }]
keywords = ["memory", "mcp", "llm", "agents", "long-term-memory"]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
]

[project.optional-dependencies]
server = ["uvicorn>=0.29"]
vault = ["pynacl>=1.5"]
fast = ["numpy>=1.24"]  # optional speedup for rerank/consolidation; pure-Python fallback otherwise

[project.scripts]
forget-server = "forget.cli:main"

[project.urls]
Homepage = "https://multi-turn.ai"
Repository = "https://github.com/multi-turn-inc/forget"

[tool.hatch.build.targets.wheel]
packages = ["forget"]
