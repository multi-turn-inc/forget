<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">
<rect width="760" height="470" fill="white"/>
<text x="64" y="28" font-size="17" font-weight="600" fill="#1f2430">Memory as compression: fewer tokens, better answers</text>
<text x="64" y="48" fill="#6b7280">LongMemEval accuracy vs context tokens read per question (log scale)</text>
<line x1="64" y1="374.0" x2="732" y2="374.0" stroke="#e5e7eb"/>
<text x="56" y="378.0" text-anchor="end" fill="#6b7280">50%</text>
<line x1="64" y1="305.1" x2="732" y2="305.1" stroke="#e5e7eb"/>
<text x="56" y="309.1" text-anchor="end" fill="#6b7280">60%</text>
<line x1="64" y1="236.2" x2="732" y2="236.2" stroke="#e5e7eb"/>
<text x="56" y="240.2" text-anchor="end" fill="#6b7280">70%</text>
<line x1="64" y1="167.3" x2="732" y2="167.3" stroke="#e5e7eb"/>
<text x="56" y="171.3" text-anchor="end" fill="#6b7280">80%</text>
<line x1="64" y1="98.4" x2="732" y2="98.4" stroke="#e5e7eb"/>
<text x="56" y="102.4" text-anchor="end" fill="#6b7280">90%</text>
<line x1="64.0" y1="374" x2="64.0" y2="379" stroke="#6b7280"/>
<text x="64.0" y="394" text-anchor="middle" fill="#6b7280">1k</text>
<line x1="151.4" y1="374" x2="151.4" y2="379" stroke="#6b7280"/>
<text x="151.4" y="394" text-anchor="middle" fill="#6b7280">2k</text>
<line x1="266.9" y1="374" x2="266.9" y2="379" stroke="#6b7280"/>
<text x="266.9" y="394" text-anchor="middle" fill="#6b7280">5k</text>
<line x1="354.3" y1="374" x2="354.3" y2="379" stroke="#6b7280"/>
<text x="354.3" y="394" text-anchor="middle" fill="#6b7280">10k</text>
<line x1="441.7" y1="374" x2="441.7" y2="379" stroke="#6b7280"/>
<text x="441.7" y="394" text-anchor="middle" fill="#6b7280">20k</text>
<line x1="557.2" y1="374" x2="557.2" y2="379" stroke="#6b7280"/>
<text x="557.2" y="394" text-anchor="middle" fill="#6b7280">50k</text>
<line x1="644.6" y1="374" x2="644.6" y2="379" stroke="#6b7280"/>
<text x="644.6" y="394" text-anchor="middle" fill="#6b7280">100k</text>
<line x1="732.0" y1="374" x2="732.0" y2="379" stroke="#6b7280"/>
<text x="732.0" y="394" text-anchor="middle" fill="#6b7280">200k</text>
<text x="398.0" y="414" text-anchor="middle" fill="#1f2430">context tokens per question (log)</text>
<line x1="64" y1="64" x2="64" y2="374" stroke="#1f2430" stroke-width="1"/>
<line x1="64" y1="374" x2="732" y2="374" stroke="#1f2430" stroke-width="1"/>
<line x1="64" y1="119.1" x2="732" y2="119.1" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="732" y="113.1" text-anchor="end" fill="#6b7280">GPT-4o oracle ceiling 87.0% (paper)</text>
<circle cx="662.2" cy="301.0" r="6" fill="#6b7280"/>
<text x="662.2" y="325.0" text-anchor="end" fill="#1f2430">GPT-4o, full context</text>
<text x="662.2" y="341.0" text-anchor="end" fill="#6b7280">~115k tok → 60.6%</text>
<line x1="87.0" y1="178.4" x2="151.4" y2="178.4" stroke="#2563eb" stroke-width="2"/>
<line x1="87.0" y1="173.4" x2="87.0" y2="183.4" stroke="#2563eb" stroke-width="2"/>
<line x1="151.4" y1="173.4" x2="151.4" y2="183.4" stroke="#2563eb" stroke-width="2"/>
<line x1="119.2" y1="181.1" x2="119.2" y2="175.6" stroke="#2563eb" stroke-width="2"/>
<circle cx="119.2" cy="178.4" r="6" fill="#2563eb"/>
<text x="119.2" y="148.4" text-anchor="start" font-weight="600" fill="#2563eb">forget</text>
<text x="119.2" y="164.4" text-anchor="start" fill="#1f2430">~1.2–2k tok → 78.4% ± 0.4</text>
<text x="390.7" y="231.7" text-anchor="middle" fill="#1f2430">+17.8pp with ~1/57 of the tokens</text>
<text x="64" y="430" font-size="11" fill="#6b7280">Sources: GPT-4o full-context 60.6% and oracle 87.0% — LongMemEval paper (ICLR 2025, arXiv:2410.10813).</text>
<text x="64" y="445" font-size="11" fill="#6b7280">forget 78.4% ± 0.4 — 3 seeds (exp №0003); payload tokens are a documented 1.2–2k estimate, drawn as a range.</text>
<text x="64" y="460" font-size="11" fill="#6b7280">Excluded: forget best-config 81.8% (runs/full-v3-500) — its payload tokens were never measured, so it has no honest x.</text>
</svg>