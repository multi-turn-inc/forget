<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>책상</title>
<link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css'>
<style>
/* 책상 v4 — 대화가 주인공. Claude Code처럼: 상태 한 줄 · 흐르는 기록(말·도구·결과) · 입력 하나. 생각·예측은 위 여백에 작게. (2026-09-07 정훈 «UI/UX 구려. 이게 최선이냐») */
:root{--bg:#FAF9F6;--fg:#1B1A18;--soft:#5D5B56;--mute:#9C9994;--line:#E8E5DF;--tool:#6B6862;--acc:#C2410C;--ok:#22A06B;--mono:ui-monospace,'SF Mono',Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#EDEBE6;--soft:#B3B0A9;--mute:#75736D;--line:#2A2927;--tool:#8E8B84;--acc:#F0844A;--ok:#3DBE84}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
.top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.on .pulse{background:var(--ok);animation:pulse 2.4s ease-in-out infinite}
.busy .pulse{background:var(--acc);animation-duration:.9s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.pulse,.cursor::after{animation:none}}
.top b{color:var(--fg);font-weight:500}
.aside{max-width:760px;margin:0 auto;padding:16px 20px 0;color:var(--soft);font-size:14px}
.aside .k{color:var(--mute);font-size:12px;margin-right:8px}
.preds summary{list-style:none;cursor:pointer;font-size:12px;color:var(--mute);letter-spacing:.04em}
.preds summary::-webkit-details-marker{display:none}
.pred{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--soft)}
.pred:first-child{border-top:0}
.pred p{margin:0;flex:1}.pred small{display:block;color:var(--mute);font-size:12px}
.pred button{border:1px solid var(--line);background:transparent;border-radius:6px;font:inherit;font-size:12px;padding:3px 9px;cursor:pointer;color:var(--soft)}
.pred button:hover{border-color:var(--fg);color:var(--fg)}.pred.done{opacity:.35}
.feed{max-width:760px;margin:0 auto;padding:12px 20px 160px}
.m{padding:14px 0;border-top:1px solid var(--line)}
.m:first-child{border-top:0}
.m .who{font-size:12px;color:var(--mute);margin-bottom:4px;display:flex;gap:8px}
.m .who .ts{margin-left:auto}
.m .t{white-space:pre-wrap}
.m.you .t{font-weight:500}
.m.live{border-top:1px dashed var(--line)}
.m.wait .t{color:var(--mute);font-style:italic}.m.wait .t::after{content:' …';animation:blink 1.2s steps(2) infinite}
.m.live details{margin-top:6px}.m.live summary{list-style:none;cursor:pointer;font-size:12px;color:var(--mute);letter-spacing:.04em}.m.live summary::-webkit-details-marker{display:none}
.m .t{font-size:16px;line-height:1.7}.m.you .t{font-size:17px}
.ln{font:12.5px/1.75 var(--mono);color:var(--tool);white-space:pre-wrap;word-break:break-all;padding-left:14px;position:relative}
.ln::before{content:'›';position:absolute;left:0;color:var(--mute)}
.ln.r{color:var(--mute);padding-left:28px}.ln.r::before{content:'↳';left:14px}
.ln b{color:var(--fg);font-weight:500}
.ln.p{color:var(--mute);font-style:italic;font-family:inherit;font-size:13px}.ln.p::before{content:''}
.say{white-space:pre-wrap;margin:8px 0 4px}
.cursor::after{content:'▍';color:var(--acc);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px 24px;background:linear-gradient(transparent,var(--bg) 35%)}
.bar form{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 10px 10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.bar textarea{flex:1;border:0;background:transparent;font:inherit;font-size:15px;line-height:1.5;outline:none;color:var(--fg);resize:none;max-height:160px}
.bar textarea::placeholder{color:var(--mute)}
.bar button{border:0;border-radius:8px;width:34px;height:34px;background:var(--fg);color:var(--bg);cursor:pointer;font-size:15px;flex:none}
.empty{color:var(--mute)}
</style></head><body>
<div class='top'><div class='in'><div class='pulse'></div><div id='status'>…</div></div></div>
<div class='aside' id='thought'></div>
<details class='aside preds' id='preds'><summary>너에 대한 내 예측 ›</summary><div id='predlist'></div></details>
<div class='feed' id='feed'></div>
<div class='bar'><form id='f'><textarea id='t' rows='1' placeholder='말해' autocomplete='off'></textarea><button type='submit' aria-label='보내기'>↑</button></form></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const one=s=>String(s??'').replace(/[ \t\n]+/g,' ').trim();
function rel(t,now){if(!t)return '';const d=now-t,a=Math.abs(d),s=d<0?' 뒤':' 전';if(a<60)return Math.round(a)+'초'+s;if(a<3600)return Math.round(a/60)+'분'+s;return (a/3600).toFixed(1)+'시간'+s}
const NOISE=/^Client\.listTools[^\n]*\n?/gm;
let judged={},feedKey='',predKey='';
async function tick(){try{
 const s=await(await fetch('/api/state',{cache:'no-store'})).json();const now=s.now||Date.now()/1000;const st=s.state||{};
 const phase=s.phase||'';const sleeping=/잔다|대기/.test(phase);const busy=s.alive&&!sleeping&&/중|턴/.test(phase);
 document.body.className=!s.alive?'':busy?'on busy':'on';
 const wake=st.wake_at&&st.wake_at>now?'다음 생각 '+rel(st.wake_at,now):'';
 $('status').innerHTML=!s.alive?'상주가 없다':['<b>'+esc(phase||'있다')+'</b>',wake,s.brain?'뇌 '+esc(s.brain):'',st.last_turn?'마지막 턴 '+rel(st.last_turn,now):''].filter(Boolean).join(' · ');
 $('thought').innerHTML=st.thought?'<span class=\'k\'>생각</span>'+esc(st.thought)+(st.thought_at?' <span class=\'k\'>'+rel(st.thought_at,now)+'</span>':''):'';
 const preds=(s.predictions||[]).slice(0,3);const pk=preds.join('|');
 if(pk!==predKey){predKey=pk;
  $('predlist').innerHTML=preds.map((p,i)=>{const j=p.indexOf('틀리면');const h=j<0?p:p.slice(0,j);const t=j<0?'':p.slice(j+3).replace(/^[:： ]+/,'');return `<div class='pred${judged[i]?' done':''}' data-i='${i}'><p>${esc(h.trim())}${t?`<small>틀리면 ${esc(t.trim())}</small>`:''}</p><button data-v='맞아'>맞아</button><button data-v='아니야'>아니야</button></div>`}).join('')||`<p class='empty'>아직 예측이 없다. 밤에 생긴다.</p>`;
  $('predlist').querySelectorAll('button').forEach(b=>b.onclick=async()=>{const c=b.closest('.pred');judged[c.dataset.i]=1;c.classList.add('done');await say(`예측 ${Number(c.dataset.i)+1} ${b.dataset.v}: ${preds[c.dataset.i].slice(0,80)}`)});
 }
 const notes=s.inbox||[];const dd=[];for(const n of notes){const p=dd[dd.length-1];if(p&&p.who===n.who&&p.t===n.t)continue;dd.push(n)}
 let html=dd.slice(-30).map(n=>`<div class='m ${n.who==='나'?'me':'you'}'><div class='who'>${n.who==='나'?'나':'정훈'}</div><div class='t'>${esc(n.t)}</div></div>`).join('');
 const lastN=dd[dd.length-1];if(lastN&&lastN.who!=='나'&&s.alive)html+=`<div class='m me wait'><div class='who'>나</div><div class='t'>${busy?'답하는 중':'듣고 있다'}</div></div>`;
 const items=(s.turn||[]).map(x=>x.k==='say'?{...x,t:String(x.t).replace(NOISE,'').trim()}:x).filter(x=>x.k!=='say'||x.t);
 if(items.length){
  const says=items.filter(x=>x.k==='say').map(x=>`<div class='say'>${esc(x.t)}</div>`).join('');
  const work=items.filter(x=>x.k!=='say');
  const rows=work.map(x=>x.k==='tool'?`<div class='ln'><b>${esc(x.name)}</b> ${esc(x.head||'')}</div>`:x.k==='result'?`<div class='ln r'>${esc(one(x.t).slice(0,160))}</div>`:`<div class='ln p'>${esc(one(x.t).slice(0,200))}</div>`).join('');
  const ntool=work.filter(x=>x.k==='tool').length;
  html+=`<div class='m live'><div class='who'>지금 턴<span class='ts'>${esc(s.turn_ts||'')}</span></div>${says}${busy?`<div class='say cursor'></div>`:''}${rows?`<details><summary>${ntool?`도구 ${ntool}번 ›`:'자세히 ›'}</summary>${rows}</details>`:''}</div>`;
 }
 const key=html.length+':'+html.slice(-240);
 if(key!==feedKey){const atBottom=window.innerHeight+window.scrollY>=document.body.scrollHeight-120;$('feed').innerHTML=html||`<p class='empty'>아직 없다</p>`;feedKey=key;if(atBottom)window.scrollTo(0,document.body.scrollHeight)}
}catch(e){document.body.className='';$('status').textContent='책상이 상주를 못 본다'}}
async function say(t){await fetch('/api/say',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});setTimeout(tick,400)}
const ta=$('t');
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit()}});
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,160)+'px'});
$('f').onsubmit=e=>{e.preventDefault();const t=ta.value.trim();if(!t)return;ta.value='';ta.style.height='auto';say(t)};
tick();setInterval(tick,1500);window.scrollTo(0,document.body.scrollHeight);
</script></body></html>
