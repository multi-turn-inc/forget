<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>얼굴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* 얼굴 — 도란 v3 시각 언어(2026-09-06 승인)를 그대로: 빛이 배경을 그리고, 말이 주인공. 유리 판·검정 알약·큰 인용·작은 설명 */
:root{--bg:#FBF8F3;--ink:#17161A;--soft:#5B5760;--faint:#9A96A0;--line:rgba(23,22,26,.08);--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.75);--ok:#2C9A5B;--warn:#D8562E;--r:28px;--serif:"MaruBuri","Gowun Batang","Noto Serif KR",serif;--mono:"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg) radial-gradient(60% 50% at 22% 32%,#FFC9A3 0%,rgba(255,255,255,0) 100%),radial-gradient(50% 45% at 85% 18%,#FFE7B8 0%,rgba(255,255,255,0) 100%),radial-gradient(55% 50% at 60% 85%,#CFE0F7 0%,rgba(255,255,255,0) 100%);background-attachment:fixed;color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",-apple-system,"Noto Sans KR",system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;font-variant-numeric:tabular-nums;height:100%}
canvas.light{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
.top{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:12px;padding:18px 28px;font-size:14px;color:var(--soft)}
.top .name{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.top .dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}.top .dot.on{background:var(--ok)}.top .dot.busy{background:#E0A24C;box-shadow:0 0 0 4px rgba(224,162,76,.18)}
.top .who{margin-left:auto}
.top select{appearance:none;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:999px;padding:8px 14px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:88px 24px 150px;min-height:100vh}
.older{font-size:14px;color:var(--faint);text-align:center;margin:0 0 26px;cursor:pointer}
.msg{margin:0 0 18px;display:flex}
.msg.me{justify-content:flex-end}
.msg.me .b{background:var(--ink);color:#fff;border-radius:22px 22px 6px 22px;padding:12px 18px;max-width:78%;white-space:pre-wrap;font-size:16px;line-height:1.55}
.msg.ai .b{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-b);border-radius:var(--r);padding:20px 24px;max-width:92%;box-shadow:0 12px 40px rgba(60,40,30,.07)}
.msg.ai .b>*:first-child{margin-top:0}.msg.ai .b>*:last-child{margin-bottom:0}
.msg.ai .b p{margin:0 0 12px}.msg.ai .b ul,.msg.ai .b ol{margin:0 0 12px;padding-left:22px}.msg.ai .b li{margin:2px 0}
.msg.ai .b strong{font-weight:600}.msg.ai .b h1,.msg.ai .b h2,.msg.ai .b h3{font-family:var(--serif);font-size:20px;margin:6px 0 10px}
.msg.ai .b code{font-family:var(--mono);font-size:13.5px;background:rgba(23,22,26,.06);padding:1px 6px;border-radius:6px}
.msg.ai .b pre{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow:auto;font-size:13px}.msg.ai .b pre code{background:none;padding:0}
.msg.ai .b table{border-collapse:collapse;font-size:15px}.msg.ai .b td,.msg.ai .b th{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left}
.msg.ai .b blockquote{margin:0 0 12px;padding-left:14px;border-left:2px solid var(--line);color:var(--soft);font-family:var(--serif)}
.cursor::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-left:6px;vertical-align:middle;animation:b 1.1s infinite}@keyframes b{50%{opacity:.15}}
.tool{margin:-8px 0 14px 8px;font-size:13px;color:var(--faint);font-family:var(--mono)}
.tool summary{cursor:pointer;list-style:none;display:inline-flex;gap:8px;align-items:center}.tool summary::before{content:"›";color:var(--soft)}
.tool pre{margin:8px 0 0;padding:10px 12px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:14px;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12.5px;color:var(--soft)}
.mem{position:fixed;right:28px;top:84px;width:300px;z-index:2;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-b);border-radius:var(--r);padding:18px 20px;box-shadow:0 12px 40px rgba(60,40,30,.07);font-size:14px;line-height:1.5;max-height:calc(100vh - 220px);overflow:auto}
.mem .t{font-size:13px;font-weight:600;color:var(--faint);margin-bottom:10px;display:flex;justify-content:space-between}
.mem .it{padding:8px 0;border-top:1px solid var(--line);color:var(--soft)}.mem .it:first-of-type{border-top:0}
.mem .l{display:inline-block;width:8px;height:8px;border-radius:50%;background:#C9A227;margin-right:8px;vertical-align:1px}.mem .l.green{background:var(--ok)}.mem .l.red{background:var(--warn)}
.mem .meta{font-size:12.5px;color:var(--faint);margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:18px 24px 26px;background:linear-gradient(rgba(251,248,243,0),rgba(251,248,243,.85) 40%)}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-b);border-radius:30px;padding:8px 8px 8px 20px;box-shadow:0 12px 40px rgba(60,40,30,.09)}
textarea{flex:1;resize:none;border:0;background:transparent;font:inherit;font-size:17px;line-height:1.5;color:var(--ink);padding:10px 0;min-height:44px;max-height:220px;outline:none}
textarea::placeholder{color:var(--faint)}
.go{border:0;border-radius:999px;width:46px;height:46px;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.go svg{width:20px;height:20px}.go.stop{background:var(--warn)}
@media(max-width:1180px){.mem{display:none}}
</style></head><body>
<canvas class="light"></canvas>
<div class="top"><span class="dot" id="dot"></span><span class="name">얼굴</span><span id="sess"></span>
<span class="who"><select id="pick"><option value="anthropic|claude-fable-5-1">Fable 5.1</option><option value="anthropic|claude-opus-5">Opus 5</option><option value="openai|gpt-5.5">GPT-5.5</option><option value="spark|qwen3.6:27b">Spark Qwen 27B</option></select></span></div>
<div class="wrap"><div class="older" id="older" hidden></div><div id="main"></div></div>
<div class="mem"><div class="t"><span>기억 블록</span><span id="mu"></span></div><div id="block"><div class="it">사이드카 대기</div></div><div class="meta" id="side"></div><div class="t" style="margin-top:16px"><span>남긴 관찰</span></div><div id="obs"><div class="it">아직 없다</div></div></div>
<div class="bar"><div class="in"><textarea id="in" placeholder="말해" rows="1"></textarea><button class="go" id="go" aria-label="보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
<script>
/* 빛 배경 — 도란 light.js와 동일 팔레트 */
if(location.search.includes('flat')){document.querySelector('canvas.light').remove();document.documentElement.style.setProperty('--glass','rgba(255,255,255,.9)')}
(function(){const cv0=document.querySelector('canvas.light');if(!cv0)return;const P=[[5,['#F8F1EC','#F9C9B6','#D6E1F0','#F3E3C0']],[8,['#FFF6EA','#FFC9A3','#FFE7B8','#CFE0F7']],[11,['#F7FAFF','#DCE9FF','#FFF1D6','#E8F3FF']],[16,['#FFF3E6','#FFB98A','#FFD9A8','#FFE9C9']],[19,['#F6EEE6','#F0B58F','#F7D6B0','#D9DDE3']],[22,['#EFEDE8','#D8D3CA','#E6E0D4','#CFD3D8']]];
function pal(h){let p=P[0][1];for(const [hh,c] of P){if(h>=hh)p=c}return p}
function draw(cv,t){const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,h=new Date().getHours();const [bg,a,b,c]=pal(h);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
[[0.22,0.32,0.75,a],[0.85,0.18,0.6,b],[0.6,0.85,0.7,c]].forEach(([x,y,r,col],i)=>{const dx=Math.sin(t/9000+i*2)*0.04,dy=Math.cos(t/11000+i)*0.03;const g=ctx.createRadialGradient(W*(x+dx),H*(y+dy),0,W*(x+dx),H*(y+dy),Math.max(W,H)*r);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)});
const sun=Math.sin(Math.PI*Math.min(Math.max((h-6)/12,0),1));if(sun>0){const sx=W*0.72,sy=H*(0.95-0.7*sun);const g=ctx.createRadialGradient(sx,sy,0,sx,sy,W*0.35);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.25,'rgba(255,240,210,.55)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
if(!cv._g){const g=document.createElement('canvas');g.width=g.height=160;const gc=g.getContext('2d'),im=gc.createImageData(160,160);for(let i=0;i<im.data.length;i+=4){const v=200+Math.random()*55;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=14}gc.putImageData(im,0,0);cv._g=ctx.createPattern(g,'repeat')}ctx.fillStyle=cv._g;ctx.fillRect(0,0,W,H)}
const cv=document.querySelector('canvas.light');function fit(){cv.width=Math.round(innerWidth*devicePixelRatio);cv.height=Math.round(innerHeight*devicePixelRatio)}fit();draw(cv,0);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const loop=t=>{draw(cv,t);requestAnimationFrame(loop)};requestAnimationFrame(loop)}addEventListener('resize',()=>{fit();draw(cv,0)})})();
/* 대화 */
const $=s=>document.querySelector(s);const main=$("#main");let cur=null,busy=false,seq=0;
function md(t){try{return marked.parse(t,{breaks:true})}catch{return esc(t)}}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function el(cls,html){const d=document.createElement("div");d.className=cls;d.innerHTML=html;main.appendChild(d);scrollTo(0,document.body.scrollHeight);return d}
function addMe(t){el("msg me",`<div class="b">${esc(t)}</div>`)}
function ensureAi(){if(!cur){cur=el("msg ai",`<div class="b cursor"></div>`);cur.b=cur.querySelector(".b");cur.txt=""}return cur}
function endAi(){if(cur){cur.b.classList.remove("cursor");cur.b.innerHTML=md(cur.txt);cur=null}}
function setBusy(v){busy=v;$("#dot").className="dot "+(v?"busy":"on");$("#go").className="go"+(v?" stop":"");$("#go").innerHTML=v?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'}
function onEv(ev){
  if(ev.type==="message_update"&&ev.assistantMessageEvent){const e=ev.assistantMessageEvent;if(e.type==="text_delta"){const a=ensureAi();a.txt+=e.delta;a.b.innerHTML=md(a.txt);scrollTo(0,document.body.scrollHeight)}}
  else if(ev.type==="tool_execution_start"){endAi();const d=el("tool",`<details><summary>${esc(ev.toolName||"도구")} <span>${esc(((ev.args&&(ev.args.command||ev.args.path||ev.args.query))||"")+"").slice(0,90)}</span></summary><pre>…</pre></details>`);d.id="t-"+ev.toolCallId}
  else if(ev.type==="tool_execution_end"){const d=document.getElementById("t-"+ev.toolCallId);if(d){const out=(ev.result&&ev.result.content||[]).map(c=>c.text||"").join("\n");d.querySelector("pre").textContent=out.slice(0,4000)||"(출력 없음)"}}
  else if(ev.type==="message_end"&&ev.message&&ev.message.role==="assistant"){endAi()}
  else if(ev.type==="agent_start"){setBusy(true)}
  else if(ev.type==="agent_settled"){endAi();setBusy(false);refreshSide()}
  else if(ev.type==="compaction_start"){el("tool","<details><summary>기억 정리 중</summary></details>")}
}
function connect(){const es=new EventSource("/events?since="+seq);es.onmessage=m=>{const ev=JSON.parse(m.data);seq=ev._seq||seq;onEv(ev)};es.onerror=()=>{es.close();setTimeout(connect,1500)}}
async function sendMsg(){const t=$("#in").value.trim();if(!t)return;$("#in").value="";$("#in").style.height="auto";addMe(t);await fetch("/prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(busy?{message:t,streaming:"steer"}:{message:t})})}
$("#go").onclick=()=>busy?fetch("/abort",{method:"POST"}):sendMsg();
$("#in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg()}});
$("#in").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(220,e.target.scrollHeight)+"px"});
$("#pick").onchange=async e=>{const [p,m]=e.target.value.split("|");await fetch("/model",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider:p,modelId:m})});refreshState()};
async function refreshState(){try{const s=await(await fetch("/state")).json();const d=s.data||{};const mp=d.model?.provider||"",mi=d.model?.id||"";$("#sess").textContent=d.sessionName||"";const v=`${mp}|${mi}`;if([...$("#pick").options].some(o=>o.value===v))$("#pick").value=v;else if(mi){const o=document.createElement("option");o.value=v;o.textContent=mi;$("#pick").appendChild(o);$("#pick").value=v}$("#dot").classList.add("on")}catch{}}
function clean(t){return t.replace(/^(Task \S+ is \w+\.\s*|\[관찰·\w+\]\s*)/,"").replace(/\s+/g," ").slice(0,150)}
async function refreshSide(){try{const s=await(await fetch("/sidecar")).json();$("#block").innerHTML=s.block.length?s.block.map(b=>`<div class="it"><span class="l ${b.light||"yellow"}"></span>${esc(clean(b.text))}</div>`).join(""):'<div class="it">아직 고른 게 없다</div>';$("#obs").innerHTML=(s.observed&&s.observed.length)?s.observed.slice().reverse().map(o=>`<div class="it"><span style="color:var(--faint);font-size:12px">${esc(o.kind||"")} · ${(o.at||"").slice(11,16)}Z</span><br>${esc(clean(o.text||""))}</div>`).join(""):'<div class="it">아직 없다</div>';$("#mu").textContent=s.updated_at?s.updated_at.slice(11,16)+"Z":"";const j=s.last;$("#side").textContent=[j?`판정 ${Math.round(j.judge_s)}초 · 놀람 ${j.judge?.surprise??"-"}`:"",s.silence?`침묵 ${s.silence}/30`:""].filter(Boolean).join(" · ")}catch{}}
async function loadHistory(){try{const r=await(await fetch("/messages")).json();const ms=(r.data?.messages||[]).filter(m=>m.role==="user"||m.role==="assistant");const items=[];for(const m of ms){if(m.role==="user"){const c=typeof m.content==="string"?m.content:(m.content||[]).map(p=>p.text||"").join("");if(c&&!c.startsWith("[Request")&&!c.startsWith("<"))items.push(["me",c])}else{const t=(m.content||[]).filter(p=>p.type==="text").map(p=>p.text).join("");if(t.trim())items.push(["ai",t])}}
  const keep=6;const old=items.slice(0,-keep),recent=items.slice(-keep);
  const render=list=>{for(const [k,t] of list){if(k==="me")addMe(t);else{const a=el("msg ai",`<div class="b"></div>`);a.querySelector(".b").innerHTML=md(t)}}};
  if(old.length){const o=$("#older");o.hidden=false;o.textContent=`이전 대화 ${old.length}개 펼치기`;o.onclick=()=>{o.hidden=true;const f=document.createDocumentFragment();const tmp=main.innerHTML;main.innerHTML="";render(old);const cut=main.innerHTML;main.innerHTML=cut+tmp;scrollTo(0,0)}}
  render(recent)}catch{}}
loadHistory().then(()=>{connect();refreshState();refreshSide();setInterval(refreshSide,4000);if(!location.search.includes('noscroll'))scrollTo(0,document.body.scrollHeight)});
</script></body></html>
